spring.application.name=order-and-operations-service

server.port = 8084

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/quickbite
spring.datasource.username=postgres
spring.datasource.password=12345

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false


# Microservices Network Routing Map
# Points to the exact port where your Restaurant service runs locally
app.services.restaurant-url=http://localhost:8585


# The address of your Kafka broker(s)
spring.kafka.bootstrap-servers=localhost:9092

# Producer Serialization (Crucial for Order Events)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
