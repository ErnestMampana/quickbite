spring.application.name=order-and-operations-service

server.port = 8084

server.forward-headers-strategy=framework


# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/quickbite
spring.datasource.username=postgres
spring.datasource.password=12345

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false


# Microservices Network Routing Map
# Points to the exact port where your Restaurant service runs locally
app.services.restaurant-url=http://localhost:8585
#app.services.payment-url=http://localhost:8086


# The address of your Kafka broker(s)
spring.kafka.bootstrap-servers=localhost:9092

# Kafka Producer Serialization (REQUIRED so OrderPlacedEvent & OrderStatusChangedEvent serialize as JSON)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Kafka Consumer Configuration (for Payment Events)
spring.kafka.consumer.group-id=order-and-operations-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=za.co.ernest.quickbite.order_and_operations_service.event.consumer.PaymentEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Topic Name (matches PaymentEventPublisher's default)
app.kafka.topics.payment-events=payment-events