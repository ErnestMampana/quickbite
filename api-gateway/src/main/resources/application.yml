server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
          routes:
            - id: authentication-service
              uri: http://${AUTH_SERVICE_HOST:localhost}:8081
              predicates:
                - Path=/api/v1/auth/**

            - id: restaurant-service
              uri: http://${RESTAURANT_SERVICE_HOST:localhost}:8082
              predicates:
                - Path=/api/v1/restaurant/**,/api/v1/restaurants/**,/api/v1/products/**
              filters:
                - AuthenticationFilter

            - id: cart-service
              uri: http://${CART_SERVICE_HOST:localhost}:8083
              predicates:
                - Path=/api/v1/cart/**
              filters:
                - AuthenticationFilter

            - id: order-service
              uri: http://${ORDER_SERVICE_HOST:localhost}:8084
              predicates:
                - Path=/api/v1/orders/**
              filters:
                - AuthenticationFilter

            - id: payment-service
              uri: http://${PAYMENT_SERVICE_HOST:localhost}:8086
              predicates:
                - Path=/api/v1/payments/**

            - id: auth-service-docs
              uri: http://${AUTH_SERVICE_HOST:localhost}:8081
              predicates:
                - Path=/v3/api-docs/auth-service
              filters:
                - RewritePath=/v3/api-docs/auth-service, /v3/api-docs

            - id: restaurant-service-docs
              uri: http://${RESTAURANT_SERVICE_HOST:localhost}:8082
              predicates:
                - Path=/v3/api-docs/restaurant-service
              filters:
                - RewritePath=/v3/api-docs/restaurant-service, /v3/api-docs

            - id: cart-service-docs
              uri: http://${CART_SERVICE_HOST:localhost}:8083
              predicates:
                - Path=/v3/api-docs/cart-service
              filters:
                - RewritePath=/v3/api-docs/cart-service, /v3/api-docs

            - id: order-service-docs
              uri: http://${ORDER_SERVICE_HOST:localhost}:8084
              predicates:
                - Path=/v3/api-docs/order-service
              filters:
                - RewritePath=/v3/api-docs/order-service, /v3/api-docs

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: 1. Authentication Service
        url: /v3/api-docs/auth-service
      - name: 2. Restaurant & Product Service
        url: /v3/api-docs/restaurant-service
      - name: 3. Cart Service
        url: /v3/api-docs/cart-service
      - name: 4. Order Service
        url: /v3/api-docs/order-service

app:
  security:
    jwt:
      secret: SecureSigningKeyLongEnoughToMeetHMACMinBits256RequirementString

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
