services:
  # ==========================================
  # INFRASTRUCTURE: POSTGRESQL & KAFKA (KRAFT)
  # ==========================================
  postgres:
    image: postgres:17-alpine
    container_name: quickbite-postgres
    environment:
      POSTGRES_DB: quickbite
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quickbite"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quickbite-net

  kafka:
    image: apache/kafka:3.9.0
    container_name: quickbite-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - quickbite-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: quickbite-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: quickbite-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - quickbite-net

  mailpit:
    image: axllent/mailpit:latest
    container_name: quickbite-mailpit
    ports:
      - "1025:1025" # SMTP port for Spring Boot
      - "8025:8025" # Web inbox UI (open http://localhost:8025 in your browser)
  # ==========================================
  # MICROSERVICES
  # ==========================================
  authentication-service:
    build:
      context: ./authentication-service
    container_name: quickbite-auth
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/quickbite
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 12345
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_SECURITY_JWT_SECRET: SecureSigningKeyLongEnoughToMeetHMACMinBits256RequirementString
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - quickbite-net

  restaurant-service:
    build:
      context: ./restaurant-service
    container_name: quickbite-restaurant
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/quickbite
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 12345
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - quickbite-net

  cart-service:
    build:
      context: ./cart
    container_name: quickbite-cart
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      APP_SERVICES_ORDER_URL: http://order-service:8084
    depends_on:
      - order-service
    networks:
      - quickbite-net

  order-service:
    build:
      context: ./order-service
    container_name: quickbite-order
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/quickbite
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 12345
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_SERVICES_RESTAURANT_URL: http://restaurant-service:8082
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - quickbite-net

  payment-service:
    build:
      context: ./payment-service
    container_name: quickbite-payment
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/quickbite_payments
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 12345
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_SERVICES_RESTAURANT_URL: http://restaurant-service:8086
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - quickbite-net

  api-gateway:
    build:
      context: ./api-gateway
    container_name: quickbite-gateway
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      APP_SECURITY_JWT_SECRET: SecureSigningKeyLongEnoughToMeetHMACMinBits256RequirementString
      AUTH_SERVICE_HOST: authentication-service
      RESTAURANT_SERVICE_HOST: restaurant-service
      CART_SERVICE_HOST: cart-service
      ORDER_SERVICE_HOST: order-service
      PAYMENT_SERVICE_HOST: payment-service
    depends_on:
      - authentication-service
      - restaurant-service
      - cart-service
      - order-service
    networks:
      - quickbite-net

networks:
  quickbite-net:
    driver: bridge

volumes:
  postgres_data:
