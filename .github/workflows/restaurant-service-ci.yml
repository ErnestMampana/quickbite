name: Restaurant Service CI

on:
  push:
    branches:
      - main
    paths:
      - 'restaurant-service/**'
      - '.github/workflows/restaurant-service-ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'restaurant-service/**'
      - '.github/workflows/restaurant-service-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./restaurant-service

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: quickbite
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 12345
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d quickbite"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      kafka:
        image: apache/kafka:3.9.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        options: >-
          --health-cmd="/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: restaurant-service/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/quickbite
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: 12345
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          PAYSTACK_SECRET_KEY: sk_test_ci_dummy_key
          PAYSTACK_CALLBACK_URL: http://localhost:8080/api/v1/restaurants/verify
        run: ./mvnw clean verify
