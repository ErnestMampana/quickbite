name: Order Service CI

on:
  push:
    branches:
      - main
    paths:
      - 'order-service/**'
      - '.github/workflows/order-service-ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'order-service/**'
      - '.github/workflows/order-service-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./order-service

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: quickbite
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 12345
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d quickbite"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: order-service/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw clean verify
