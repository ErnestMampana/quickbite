apiVersion: apps/v1
kind: Deployment
metadata:
  name: quickbite-kafka-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quickbite-kafka-ui
  template:
    metadata:
      labels:
        app: quickbite-kafka-ui
    spec:
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui:latest
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: quickbite-cluster
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: kafka:9092
---
apiVersion: v1
kind: Service
metadata:
  name: quickbite-kafka-ui
spec:
  selector:
    app: quickbite-kafka-ui
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP