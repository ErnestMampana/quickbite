apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: quickbite/api-gateway:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: AUTH_SERVICE_HOST
              value: authentication-service
            - name: RESTAURANT_SERVICE_HOST
              value: restaurant-service
            - name: CART_SERVICE_HOST
              value: cart-service
            - name: ORDER_SERVICE_HOST
              value: order-service
            - name: PAYMENT_SERVICE_HOST
              value: payment-service
            - name: APP_SECURITY_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: quickbite-secrets
                  key: APP_SECURITY_JWT_SECRET
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
