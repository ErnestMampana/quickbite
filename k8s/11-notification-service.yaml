apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: quickbite/notification-service:1.0
          ports:
            - containerPort: 8085
          env:
            - name: MAIL_HOST
              value: "mailpit"
            - name: MAIL_PORT
              value: "1025"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
